# 하루 한 번 **새로 올라온 계약만** 받아 화면을 다시 지어 GitHub Pages 에 올린다.
#
# 자료를 저장소에 커밋하지 않는다 — 올해 파일이 5~10MB인데 매일 커밋하면 한 해에 2GB가 쌓인다.
# 그런데 커밋을 안 하면 러너가 매일 빈손으로 시작해서 전수 수집을 하게 된다.
# 그래서 어제 결과를 Actions 캐시로 물려준다. 캐시는 깃 이력에 남지 않으므로 저장소는 안 커진다.
#
#   캐시 있음 → update.py 가 목록 앞쪽만 훑어 새 건만 받는다 (보통 2요청, 10초)
#   캐시 없음 → update.py 가 알아서 그 해를 전수로 받는다 (50요청, 3분)
#   따라잡기 실패 → update.py 가 사이트 표기 건수와 어긋난 걸 보고 스스로 전수 수집한다
#
# 어느 경우든 결과는 사이트와 맞는다.
name: 수집 및 배포

on:
  schedule:
    # 20:00 UTC = 05:00 KST. 깃허브 예약 실행은 몇 시간씩 밀리는 일이 있어 일찍 걸어 둔다.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 어제 받은 자료를 물려받는다. key 는 매번 새로 만들고 restore-keys 로 가장 최근 걸 꺼낸다
      # (캐시 항목은 덮어쓸 수 없어서 이렇게 굴린다). 못 찾으면 저장소에 커밋된 사본으로 시작한다.
      - name: 어제 자료 가져오기
        uses: actions/cache@v4
        with:
          path: public/data
          key: contracts-${{ github.run_id }}
          restore-keys: contracts-

      - name: 새로 올라온 것만 받기
        run: |
          Y=$(TZ=Asia/Seoul date +%Y)
          M=$(TZ=Asia/Seoul date +%m)
          YEARS="$Y"
          # 회계연도와 계약연도가 어긋난다. 12월에는 다음 회계연도 건이 이미 올라오고,
          # 연초에는 지난 회계연도 마감분이 늦게 붙는다. 그 시기에만 이웃 연도도 본다.
          if [ "$M" = "11" ] || [ "$M" = "12" ]; then YEARS="$YEARS $((Y+1))"; fi
          if [ "$M" = "01" ] || [ "$M" = "02" ]; then YEARS="$YEARS $((Y-1))"; fi
          echo "볼 연도: $YEARS"
          python scripts/update.py $YEARS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 화면 짓기
        env:
          # 판정 탭을 가리는 암호의 SHA-256 값. 저장소 Settings > Secrets 에 GATE_HASH 로 넣는다.
          # 지금은 비워 둬서 잠그지 않는다 — 넣고 다시 배포하면 그때부터 잠긴다.
          VITE_GATE_HASH: ${{ secrets.GATE_HASH }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
